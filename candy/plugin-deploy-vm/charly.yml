plugin-deploy-vm:
    candy:
        description: |-
            OUT-OF-TREE charly DEPLOY plugin serving the `vm` deploy SUBSTRATE —
            `target: vm` (a deployment applied INSIDE a running VM over SSH). A standalone
            Go module (go.mod + main.go) served over go-plugin gRPC via the charly plugin
            SDK; charly's loader host-builds the provider binary and connects it
            OUT-OF-PROCESS (LocalTransport). The generic pluginDeployTarget (charly core)
            reaches it via candy/plugin-fleet's Invoke(OpDeployDispatch) ->
            sdk.Executor.InvokeProvider, which Invokes it (OpExecute) with the deployment's
            InstallPlan VIEWS + a venue descriptor, and the host's executor served on the
            broker — for vm the GUEST SSHExecutor THIS PLUGIN's own venue lifecycle built
            after booting the domain, waiting for sshd / cloud-init, and ensuring charly is
            in the guest. The plugin dials BACK through the SDK
            Executor and hands the plans to the shared kit.WalkPlans: the plugin-renderable
            step kinds (Op/File/ShellHook + env.d-managed-block/ShellSnippet/Service*/
            RepoChange) it EXECUTES itself via the F2 reverse legs
            (RunSystem/RunUser/PutFile) INSIDE THE GUEST, echoing the host-computed reverse
            ops; the HOST-ENGINE kinds (Builder/LocalPkgInstall/SystemPackages/act-Op/
            ExternalPlugin) AND a `reboot: true` RebootStep it drives over the RunHostStep
            reverse leg (builders run on the host's podman + scp into the guest; a reboot
            reboots the guest + waits for the boot_id change). It returns the combined
            teardown ops the host records in the install ledger and replays at
            `charly deploy del`. The vm-substrate sibling of candy/plugin-deploy-local; this
            plugin owns BOTH the VM lifecycle (boot/destroy/console/ssh + nested
            pod-in-guest) and the plan WALK — no core-side lifecycle hook remains.
        plugin:
            providers:
                - deploy:vm
            source: github.com/opencharly/plugin-deploy-vm/candy/plugin-deploy-vm
        plan:
            - check: the out-of-tree deploy:vm plugin ships a buildable Go module (go.mod + the provider main) the host can build + serve out-of-process
              id: deploy-vm-module-present
              context:
                - build
              command: "true"

# The `vm-deploy-target` skill — ROUTING ONLY. The prose is the FILE
# `.agents/skills/vm-deploy-target/SKILL.md` at this repo's root, copied
# byte-identically (sha256 1529c53453814db0761cae9872d5c43645fa200a0e0ece8707edc821edd29917)
# from `opencharly/layer-charly-internals` at its `main`; the node carries no
# `description:`/`content:`, because an in-line body that disagrees with its file is
# a hard error in the marketplace generator.
#
# The body resolves against the OWNING CANDY's repo root (sdk/deploykit's
# `candyRepoRoot`), which is why it sits at `.agents/skills/` here and not inside
# `candy/plugin-deploy-vm/`. The destination is measured, never chosen: the VM
# deploy substrate — the guest lifecycle, the reverse-channel SSH executor and the
# plan walk — IS this plugin (opencharly/opencharly#611).
#
# `family: internals` is carried over UNCHANGED so every
# `/charly-internals:vm-deploy-target` address survives the move.
vm-deploy-target-skill:
    skill:
        name: vm-deploy-target
        family: internals
        owner: plugin-deploy-vm
        triggers:
            - "`charly update` / `charly vm *` / VM entities in `vm.yml` or `vm:`"
